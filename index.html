<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Special Surprise For You! ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      max-width: 450px;
      width: 100%;
      position: relative;
      z-index: 10;
      transition: all 0.5s ease;
    }

    h1 {
      color: #ff4757;
      font-size: 1.8rem;
      margin-bottom: 15px;
    }

    p {
      color: #57606f;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn {
      background: linear-gradient(45deg, #ff4757, #ff6b81);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(255, 71, 87, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }

    #surpriseContent {
      display: none;
      animation: fadeIn 1s ease forwards;
    }

    .share-btn {
      background: #2ed573;
      box-shadow: 0 8px 20px rgba(46, 213, 115, 0.4);
      margin-top: 15px;
    }

    .share-btn:hover {
      box-shadow: 0 12px 24px rgba(46, 213, 115, 0.5);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <div class="container">
    <!-- Initial State -->
    <div id="initialState">
      <h1>🎁 You've Received a Special Wish!</h1>
      <p>Someone sent you a magical surprise. Tap the button below to open it!</p>
      <button class="btn" onclick="revealSurprise()">✨ Tap to Open ✨</button>
    </div>

    <!-- Hidden Surprise Content -->
    <div id="surpriseContent">
      <h1>✨ 🎉 Warmest Wishes! 🎉 ✨</h1>
      <p>
        May your day be filled with endless joy, smiles, and unforgettable moments! 
        You are truly extraordinary—never forget how amazing you are! ❤️
      </p>
      <button class="btn share-btn" onclick="sharePage()">🔗 Share This Wish</button>
    </div>
  </div>

  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    function revealSurprise() {
      // Hide initial state and show surprise
      document.getElementById('initialState').style.display = 'none';
      document.getElementById('surpriseContent').style.display = 'block';

      // Launch Confetti Explosion
      var count = 200;
      var defaults = { origin: { y: 0.7 } };

      function fire(particleRatio, opts) {
        confetti(Object.assign({}, defaults, opts, {
          particleCount: Math.floor(count * particleRatio)
        }));
      }

      fire(0.25, { spread: 26, startVelocity: 55 });
      fire(0.2, { spread: 60 });
      fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
      fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
      fire(0.1, { spread: 120, startVelocity: 45 });
    }

    function sharePage() {
      if (navigator.share) {
        navigator.share({
          title: 'A Special Wish For You! ✨',
          text: 'Someone sent you a magical surprise! Open it here:',
          url: window.location.href,
        }).catch(console.error);
      } else {
        // Fallback: Copy link to clipboard
        navigator.clipboard.writeText(window.location.href);
        alert('Link copied to clipboard! You can send it to anyone now. 🚀');
      }
    }
  </script>
</body>
</html>
